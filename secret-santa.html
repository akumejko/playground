<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎅 Losowanie Secret Santa</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #0b3d2e, #12261e 60%, #3a0d12);
    color: #fff; padding: 16px;
  }
  .card {
    max-width: 520px; margin: 0 auto; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15); border-radius: 18px; padding: 20px;
  }
  h1 { text-align: center; margin: 0 0 4px; font-size: 1.6rem; }
  p.sub { text-align: center; margin: 0 0 16px; opacity: .8; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; }
  textarea, input {
    width: 100%; font-size: 16px; border-radius: 10px; border: none; padding: 12px;
    background: #fff; color: #222;
  }
  textarea { min-height: 200px; resize: vertical; }
  .hint { font-size: .85rem; opacity: .7; margin-top: 4px; }
  button {
    width: 100%; margin-top: 14px; padding: 14px; font-size: 1.1rem; font-weight: 700;
    border: none; border-radius: 12px; background: #c8102e; color: #fff; cursor: pointer;
  }
  button.secondary { background: #1f7a4d; }
  button:active { transform: scale(.98); }
  .error { color: #ffb3b3; margin-top: 10px; font-weight: 600; }
  #result { display: none; margin-top: 18px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex; justify-content: space-between; gap: 8px; align-items: center;
    background: rgba(0,0,0,.25); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px;
  }
  li code { background: rgba(255,255,255,.15); padding: 3px 6px; border-radius: 6px; font-size: .9rem; }
  li a { color: #ffd76a; }
</style>
</head>
<body>
<div class="card">
  <h1>🎅 Secret Santa 🎄</h1>
  <p class="sub">Wpisz imiona, wylosuj i pobierz pliki HTML</p>

  <label for="names">Uczestnicy (jedno imię w linii)</label>
  <textarea id="names" placeholder="Ania&#10;Bartek&#10;Kasia&#10;Tomek"></textarea>

  <label for="base">Adres, pod którym wrzucisz pliki (opcjonalnie)</label>
  <input id="base" type="url" value="https://www.mzspy.com.pl/Losowanie/2026/">
  <div class="hint">Jeśli podasz, dostaniesz gotowe linki do wysłania.</div>

  <button id="draw">🎲 Losuj!</button>
  <div id="error" class="error"></div>

  <div id="result">
    <label>Komu wysłać który plik (bez zdradzania wyników 🤫)</label>
    <ul id="list"></ul>
    <button id="zip" class="secondary">📦 Pobierz wszystkie pliki (ZIP)</button>
  </div>
</div>

<script>
// ---------- helpers ----------
const rnd = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = rnd(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function randomSuffix(len = 3) {
  const chars = 'abcdefghijkmnpqrstuvwxyz23456789';
  let s = '';
  for (let i = 0; i < len; i++) s += chars[rnd(chars.length)];
  return s;
}

const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- page for each participant ----------
function santaPage(giver, receiver) {
  return `<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>🎅 Twój Secret Santa</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family: system-ui, -apple-system, sans-serif; text-align:center; overflow:hidden;
    background: radial-gradient(circle at top, #1b5e3f, #0a2a1d 70%); color:#fff; }
  .snow { position:fixed; top:-10px; color:#fff; pointer-events:none; animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
  .box { position:relative; z-index:1; padding:28px 22px; max-width:440px; margin:16px;
    background:rgba(200,16,46,.9); border:4px dashed #ffd76a; border-radius:24px;
    box-shadow:0 10px 40px rgba(0,0,0,.5); }
  h1 { font-size:1.7rem; margin:0 0 10px; }
  .emoji { font-size:3.5rem; }
  p { font-size:1.15rem; line-height:1.5; }
  #gift { font-size:5rem; cursor:pointer; animation: shake 1.2s ease-in-out infinite; display:inline-block; user-select:none; }
  @keyframes shake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-10deg)} 75%{transform:rotate(10deg)} }
  #name { display:none; font-size:2.4rem; font-weight:800; color:#ffd76a; margin:10px 0;
    text-shadow:0 0 12px rgba(255,215,106,.7); animation: pop .6s ease-out; }
  @keyframes pop { from{transform:scale(0)} 80%{transform:scale(1.2)} to{transform:scale(1)} }
  .small { font-size:.95rem; opacity:.9; }
</style>
</head>
<body>
<div class="box">
  <div class="emoji">🎅🎄⛄</div>
  <h1>Ho ho ho, ${esc(giver)}!</h1>
  <p>Elfy sprawdziły listę dwa razy… 📜<br>Osoba, dla której będziesz Mikołajem, to:</p>
  <div id="gift" onclick="this.style.display='none';document.getElementById('name').style.display='block';document.getElementById('tap').style.display='none'">🎁</div>
  <p id="tap" class="small">👆 Stuknij w prezent, żeby odkryć!</p>
  <div id="name">✨ ${esc(receiver)} ✨</div>
  <p class="small">🤫 Ciii… to tajemnica! Nikomu nie mów.<br>Wesołych Świąt! 🦌🔔</p>
</div>
<script>
  for (let i = 0; i < 40; i++) {
    const f = document.createElement('div');
    f.className = 'snow';
    f.textContent = Math.random() < .5 ? '❄' : '•';
    f.style.left = Math.random() * 100 + 'vw';
    f.style.fontSize = (8 + Math.random() * 18) + 'px';
    f.style.opacity = .4 + Math.random() * .6;
    f.style.animationDuration = (5 + Math.random() * 10) + 's';
    f.style.animationDelay = (-Math.random() * 15) + 's';
    document.body.appendChild(f);
  }
<\/script>
</body>
</html>`;
}

// ---------- minimal ZIP writer (no compression) ----------
const crcTable = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = crcTable[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = enc.encode(f.content), crc = crc32(data);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true); // UTF-8
    local.setUint32(14, crc, true); local.setUint32(18, data.length, true);
    local.setUint32(22, data.length, true); local.setUint16(26, name.length, true);
    parts.push(local, name, data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true); cd.setUint32(16, crc, true);
    cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true);
    cd.setUint16(28, name.length, true); cd.setUint32(42, offset, true);
    central.push(cd, name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((s, p) => s + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], { type: 'application/zip' });
}

// ---------- app ----------
let files = [];

document.getElementById('draw').onclick = () => {
  const err = document.getElementById('error');
  err.textContent = '';
  const names = document.getElementById('names').value
    .split('\n').map(s => s.trim()).filter(Boolean);

  if (names.length < 2) { err.textContent = 'Potrzebne są co najmniej 2 osoby 🎅'; return; }
  const lower = names.map(n => n.toLowerCase());
  if (new Set(lower).size !== names.length) { err.textContent = 'Imiona muszą być unikalne (dodaj np. inicjał nazwiska).'; return; }

  // Shuffle, then each person gifts the next one in the circle (last → first).
  const order = shuffle(names.map((_, i) => i));
  const receiverOf = {};
  order.forEach((giverIdx, k) => { receiverOf[giverIdx] = order[(k + 1) % order.length]; });

  // File number = position on your input list, so you know whom to send it to.
  files = names.map((giver, i) => ({
    giver,
    name: `${i + 1}_${randomSuffix()}.html`,
    content: santaPage(giver, names[receiverOf[i]])
  }));

  let base = document.getElementById('base').value.trim();
  if (base && !base.endsWith('/')) base += '/';

  const list = document.getElementById('list');
  list.innerHTML = '';
  for (const f of files) {
    const li = document.createElement('li');
    const who = document.createElement('span');
    who.textContent = `🎁 ${f.giver}`;
    li.appendChild(who);
    if (base) {
      const a = document.createElement('a');
      a.href = base + f.name; a.textContent = f.name; a.target = '_blank';
      li.appendChild(a);
    } else {
      const c = document.createElement('code');
      c.textContent = f.name;
      li.appendChild(c);
    }
    list.appendChild(li);
  }
  document.getElementById('result').style.display = 'block';
};

document.getElementById('zip').onclick = () => {
  const url = URL.createObjectURL(makeZip(files));
  const a = document.createElement('a');
  a.href = url; a.download = 'secret-santa.zip';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
};
</script>
</body>
</html>
